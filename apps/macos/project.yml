name: OfflineMeetingSummary
options:
  bundleIdPrefix: sk.softverse
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 1.1.1
  # App updates (ADR-0031).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  OMSCore:
    path: OMSCore
targets:
  OfflineMeetingSummary:
    type: application
    platform: macOS
    sources:
      - path: OfflineMeetingSummary
        excludes:
          - Resources/AppIcon.icon
      # Icon Composer icon with light, dark and tinted appearances (ADR-0020). Generated by apps/macos/design/make-app-icon.py.
      - path: OfflineMeetingSummary/Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: templates
        type: folder
        buildPhase: resources
      - path: prompts
        type: folder
        buildPhase: resources
      - path: scripts/frame-at.sh
        buildPhase: resources
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: OMSCore
        product: OMSCore
      - package: Sparkle
        product: Sparkle
    info:
      path: OfflineMeetingSummary/Info.plist
      properties:
        CFBundleDisplayName: Minutes
        CFBundleName: Minutes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: The app records your microphone during a session. The recording stays on this Mac.
        NSScreenCaptureUsageDescription: The app records the selected screen and system audio during a session. The recording stays on this Mac.
        NSHumanReadableCopyright: © 2026 Softverse, spol. s r. o.
        # Sparkle (ADR-0031). The Debug build has no feed, so it never replaces itself with a release build.
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUScheduledCheckInterval: 86400
        SUEnableSystemProfiling: false
    entitlements:
      path: OfflineMeetingSummary/OfflineMeetingSummary.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        # The file is Minutes.app. The bundle ID stays, so permissions, data and Keychain stay (ADR-0021).
        PRODUCT_NAME: Minutes
        PRODUCT_BUNDLE_IDENTIFIER: sk.softverse.OfflineMeetingSummary
        MARKETING_VERSION: 1.3.0
        CURRENT_PROJECT_VERSION: 4
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEAD_CODE_STRIPPING: YES
        # Public EdDSA key from Sparkle `generate_keys`. The private key stays in the author's Keychain.
        # While it is empty, the app does not check for updates.
        SPARKLE_PUBLIC_ED_KEY: QMmuJtAUEsJheX6TAsrh8bfpAjz+q4Wjr/8FMUHTxqY=
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Release:
          SPARKLE_FEED_URL: https://softverse-space.github.io/minutes/appcast.xml
